<svg width="260" height="58" viewBox="0 0 260 58"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="258" height="56" rx="12"
        fill="#0d1117"
        stroke="url(#border)"
        stroke-width="2"/>

  <text x="25" y="25"
        fill="#22d3ee"
        font-family="Arial, sans-serif"
        font-size="11"
        font-weight="bold"
        letter-spacing="2">
    CONNECT
  </text>

  <text x="25" y="43"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold">
    LinkedIn
  </text>

  <text x="230" y="36"
        fill="#22d3ee"
        text-anchor="middle"
        font-family="monospace"
        font-size="22"
        filter="url(#glow)">
    →
  </text>

</svg>
