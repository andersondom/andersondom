<svg width="1200" height="120" viewBox="0 0 1200 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="120" rx="16" fill="#0d1117"/>

  <rect x="0" y="0" width="6" height="120" rx="3"
        fill="url(#line)" filter="url(#glow)"/>

  <text x="35" y="45"
        fill="#22d3ee"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        letter-spacing="3">
    04. CONTRIBUTIONS
  </text>

  <text x="35" y="78"
        fill="#f0f6fc"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold">
    Minha atividade no GitHub
  </text>

  <text x="1170" y="70"
        fill="#8b5cf6"
        text-anchor="end"
        font-family="monospace"
        font-size="18">
    &lt; BUILD /&gt;
  </text>

  <rect x="35" y="101" width="1130" height="2"
        rx="1" fill="url(#line)" opacity="0.8"/>
</svg>
