<svg width="1200" height="240" viewBox="0 0 1200 240"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f0a2a"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="238"
    rx="22"
    fill="url(#background)"
    stroke="#172554"
    stroke-width="2"
  />

  <!-- DECORAÇÃO -->

  <circle
    cx="80"
    cy="205"
    r="95"
    fill="#082f49"
    opacity="0.25"
  />

  <circle
    cx="1130"
    cy="35"
    r="100"
    fill="#312e81"
    opacity="0.20"
  />

  <!-- LINHA SUPERIOR -->

  <rect
    x="400"
    y="28"
    width="400"
    height="2"
    rx="1"
    fill="url(#accent)"
    filter="url(#glow)"
    opacity="0.85"
  />

  <!-- FRASE PRINCIPAL -->

  <text
    x="600"
    y="72"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="20"
    font-weight="bold"
    letter-spacing="3">
    DESENVOLVER
    <tspan fill="#22d3ee"> • </tspan>
    COMPARTILHAR
    <tspan fill="#8b5cf6"> • </tspan>
    EVOLUIR
  </text>

  <!-- AGRADECIMENTO -->

  <text
    x="600"
    y="111"
    text-anchor="middle"
    fill="#7dd3fc"
    font-family="Arial, sans-serif"
    font-size="15"
    font-weight="bold">
    Obrigado por visitar meu perfil!
  </text>

  <!-- VERSÍCULO -->

  <text
    x="600"
    y="148"
    text-anchor="middle"
    fill="#cbd5e1"
    font-family="Arial, sans-serif"
    font-size="14"
    font-style="italic">
    "Tudo quanto fizerdes, fazei-o de todo o coração."
  </text>

  <text
    x="600"
    y="173"
    text-anchor="middle"
    fill="#8b5cf6"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="bold"
    letter-spacing="2">
    COLOSSENSES 3:23
  </text>

  <!-- ASSINATURA -->

  <text
    x="600"
    y="213"
    text-anchor="middle"
    fill="#64748b"
    font-family="Arial, sans-serif"
    font-size="10"
    font-weight="bold"
    letter-spacing="3">
    ANDERSON DOMINGOS // GITHUB PROFILE
  </text>

  <!-- DETALHES -->

  <circle cx="54" cy="31" r="3" fill="#22d3ee"/>
  <circle cx="68" cy="31" r="3" fill="#3b82f6"/>
  <circle cx="82" cy="31" r="3" fill="#8b5cf6"/>

  <text
    x="1145"
    y="35"
    text-anchor="end"
    fill="#475569"
    font-family="monospace"
    font-size="10">
    &lt;/profile&gt;
  </text>

</svg>
