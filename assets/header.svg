<svg width="1200" height="340" viewBox="0 0 1200 340"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0f0a2a"/>
    </linearGradient>

    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="338"
    rx="28"
    fill="url(#background)"
    stroke="#172554"
    stroke-width="2"
  />

  <!-- Decorative circles -->

  <circle
    cx="105"
    cy="65"
    r="105"
    fill="#082f49"
    opacity="0.42"
  />

  <circle
    cx="1100"
    cy="280"
    r="135"
    fill="#312e81"
    opacity="0.28"
  />

  <!-- Decorative top line -->

  <rect
    x="55"
    y="40"
    width="160"
    height="2"
    rx="1"
    fill="#22d3ee"
    opacity="0.65"
  />

  <rect
    x="985"
    y="298"
    width="160"
    height="2"
    rx="1"
    fill="#8b5cf6"
    opacity="0.65"
  />

  <!-- Intro -->

  <text
    x="600"
    y="92"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="Arial, sans-serif"
    font-size="16"
    font-weight="bold"
    letter-spacing="6">
    HELLO, WORLD! I'M
  </text>

  <!-- Name -->

  <text
    x="600"
    y="155"
    text-anchor="middle"
    fill="url(#nameGradient)"
    font-family="Arial, sans-serif"
    font-size="52"
    font-weight="900"
    letter-spacing="2"
    filter="url(#softGlow)">
    ANDERSON DOMINGOS
  </text>

  <!-- Professional identity -->

  <text
    x="600"
    y="202"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="bold">
    .NET DEVELOPER
    <tspan fill="#22d3ee">  •  </tspan>
    PROJECT MANAGER
    <tspan fill="#8b5cf6">  •  </tspan>
    TECH ENTHUSIAST
  </text>

  <!-- Tagline container -->

  <rect
    x="350"
    y="240"
    width="500"
    height="54"
    rx="27"
    fill="#07111f"
    stroke="url(#borderGradient)"
    stroke-width="2"
  />

  <!-- Tagline -->

  <text
    x="600"
    y="274"
    text-anchor="middle"
    fill="#7dd3fc"
    font-family="Arial, sans-serif"
    font-size="16">
    transformando ideias em soluções reais
    <tspan fill="#8b5cf6"> &lt;/&gt;</tspan>
  </text>

  <!-- Bottom accent -->

  <rect
    x="475"
    y="319"
    width="250"
    height="2"
    rx="1"
    fill="url(#borderGradient)"
    filter="url(#lineGlow)"
    opacity="0.85"
  />

</svg>
