<svg width="1200" height="310" viewBox="0 0 1200 310"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="number" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="308"
    rx="22"
    fill="#020617"
    stroke="#172554"
    stroke-width="2"
  />

  <!-- Section title -->

  <text
    x="52"
    y="62"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold">
    01.
    <tspan fill="#60a5fa"> SOBRE </tspan>
    <tspan fill="#8b5cf6">MIM</tspan>
  </text>

  <!-- Main description -->

  <text
    x="52"
    y="112"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="17">
    <tspan x="52" dy="0">
      Profissional de Tecnologia da Informação com mais de 17 anos de experiência,
    </tspan>

    <tspan x="52" dy="29">
      atuando no desenvolvimento de soluções com .NET, C# e ASP.NET,
    </tspan>

    <tspan x="52" dy="29">
      além de experiência em gestão de projetos e ambientes de tecnologia.
    </tspan>
  </text>

  <!-- Focus -->

  <text
    x="52"
    y="221"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold"
    letter-spacing="2">
    FOCO
  </text>

  <text
    x="52"
    y="251"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="15">
    Soluções
    <tspan fill="#22d3ee"> • </tspan>
    Resultados
    <tspan fill="#3b82f6"> • </tspan>
    Aprendizado contínuo
    <tspan fill="#8b5cf6"> • </tspan>
    Compartilhamento de conhecimento
  </text>

  <!-- Experience card -->

  <rect
    x="870"
    y="65"
    width="260"
    height="180"
    rx="18"
    fill="#07111f"
    stroke="url(#border)"
    stroke-width="2"
  />

  <text
    x="1000"
    y="125"
    text-anchor="middle"
    fill="url(#number)"
    font-family="Arial, sans-serif"
    font-size="43"
    font-weight="bold">
    17+
  </text>

  <text
    x="1000"
    y="157"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold">
    ANOS DE EXPERIÊNCIA
  </text>

  <rect
    x="925"
    y="180"
    width="150"
    height="1"
    fill="url(#border)"
    opacity="0.65"
  />

  <text
    x="1000"
    y="210"
    text-anchor="middle"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="13">
    .NET • C# • SQL Server
  </text>

</svg>
