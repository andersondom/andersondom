<svg width="1200" height="350" viewBox="0 0 1200 350"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="number" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="348"
    rx="22"
    fill="#020617"
    stroke="#172554"
    stroke-width="2"
  />

  <!-- 01 · SOBRE MIM -->

  <text
    x="52"
    y="60"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="bold">
    01.
    <tspan fill="#60a5fa"> SOBRE </tspan>
    <tspan fill="#8b5cf6">MIM</tspan>
  </text>

  <!-- TEXTO PROFISSIONAL -->

  <text
    x="52"
    y="108"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="16">

    <tspan x="52" dy="0">
      Profissional de Tecnologia da Informação com mais de 17 anos de experiência,
    </tspan>

    <tspan x="52" dy="27">
      atuando no desenvolvimento de aplicações e soluções corporativas,
    </tspan>

    <tspan x="52" dy="27">
      banco de dados, gestão de projetos e ambientes de tecnologia.
    </tspan>

    <tspan
      x="52"
      dy="39"
      fill="#7dd3fc"
      font-weight="bold">
      Instrutor de Educação Profissional no SENAC/SE,
    </tspan>

    <tspan
      x="52"
      dy="27"
      fill="#f8fafc"
      font-weight="normal">
      compartilhando conhecimento e contribuindo para a formação
    </tspan>

    <tspan
      x="52"
      dy="27"
      fill="#f8fafc"
      font-weight="normal">
      de novos profissionais na área de Tecnologia da Informação.
    </tspan>

  </text>

  <!-- FOCO PROFISSIONAL -->

  <text
    x="52"
    y="294"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="bold"
    letter-spacing="2">
    FOCO PROFISSIONAL
  </text>

  <text
    x="52"
    y="322"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="14"
    font-weight="bold">

    Desenvolvimento

    <tspan fill="#22d3ee">
      •
    </tspan>

    Gestão de Projetos

    <tspan fill="#3b82f6">
      •
    </tspan>

    Educação Profissional

    <tspan fill="#8b5cf6">
      •
    </tspan>

    Tecnologia

  </text>

  <!-- CARD DE EXPERIÊNCIA -->

  <rect
    x="870"
    y="65"
    width="260"
    height="220"
    rx="18"
    fill="#07111f"
    stroke="url(#border)"
    stroke-width="2"
  />

  <!-- 17+ -->

  <text
    x="1000"
    y="120"
    text-anchor="middle"
    fill="url(#number)"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="bold">
    17+
  </text>

  <text
    x="1000"
    y="150"
    text-anchor="middle"
    fill="#f8fafc"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="bold"
    letter-spacing="1">
    ANOS DE EXPERIÊNCIA
  </text>

  <!-- DIVISOR -->

  <rect
    x="920"
    y="171"
    width="160"
    height="1"
    fill="url(#border)"
    opacity="0.7"
  />

  <!-- PILARES -->

  <text
    x="1000"
    y="205"
    text-anchor="middle"
    fill="#22d3ee"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold"
    letter-spacing="2">
    DESENVOLVIMENTO
  </text>

  <text
    x="1000"
    y="232"
    text-anchor="middle"
    fill="#60a5fa"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold"
    letter-spacing="2">
    GESTÃO
  </text>

  <text
    x="1000"
    y="259"
    text-anchor="middle"
    fill="#a78bfa"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="bold"
    letter-spacing="2">
    EDUCAÇÃO
  </text>

</svg>
